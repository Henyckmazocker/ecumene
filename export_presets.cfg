; Presets de export (Plan «Builds Públicas»: Web en M0, Linux y Windows en M1, Android en M3).
; Se exporta con tools/export.sh. La clave de Augur de prod va en res://augur_release.cfg, que se
; genera justo antes de exportar y se borra al acabar; include_filter lo mete en el .pck porque el
; filtro por defecto no incluye .cfg sueltos (sin él la build sale sin clave y sin ningún error).
; exclude_filter="tools/*" deja fuera tests y sondas: el juego no carga nada de res://tools/.
; Escritorio con el .pck al lado del ejecutable (embed_pck=false, lo que Godot hace por defecto).
; Android solo de depuración (APK precompilado, sin Gradle, arm64): se exporta con --export-debug
; para que Analytics mande channel = debug. Firma con el keystore de depuración de los editor settings.
; La orientación vertical sale de window/handheld/orientation en project.godot.
; runnable=false a propósito: con un preset Android ejecutable el editor sondea dispositivos con
; adb, y al cerrarse en headless suelta «EditorSettings not instantiated yet ... shutdown_adb_on_exit»,
; que tumba run_tests.sh. Se instala a mano con adb, no con el despliegue de un clic.

[preset.0]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="augur_release.cfg"
exclude_filter="tools/*"
export_path="builds/web/index.html"

[preset.0.options]

variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
html/head_include="<script>
// El juego no usa el teclado: F1-F12 y los atajos con Ctrl/Alt/Meta son del navegador (F5, F12,
// Ctrl+Mayús+I). Godot escucha en el lienzo, en burbuja, y hace preventDefault con todo; este
// oyente, en captura sobre window y puesto antes del motor, corre primero y corta la propagación
// sin cancelar la tecla. Las teclas sueltas siguen llegando al juego.
(function () {
	function delNavegador(e) {
		if (/^F([1-9]|1[0-2])$/.test(e.key) || e.ctrlKey || e.altKey || e.metaKey) {
			e.stopImmediatePropagation();
		}
	}
	window.addEventListener('keydown', delNavegador, true);
	window.addEventListener('keyup', delNavegador, true);
})();
</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false

