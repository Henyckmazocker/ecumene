# Ecúmene — nginx de la build web del homelab (ecumene.dcahomelab.com).
# Sustituye a /etc/nginx/conf.d/default.conf de nginx:alpine; el nginx.conf de la imagen ya
# incluye mime.types, y ese trae `application/wasm wasm;`, así que el .wasm sale con su tipo.
# La build es sin hilos: no hacen falta las cabeceras COOP/COEP.

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Compresión. El Dockerfile deja al lado de cada fichero grande su .gz (gzip -9, una vez,
    # al construir), y gzip_static lo sirve tal cual: comprimir 40 MB de wasm en cada petición
    # sería CPU tirada. `gzip on` cubre lo que no tenga .gz.
    # No rompe la barra de carga: Godot no lee Content-Length, toma el total de `fileSizes` en
    # index.html (tamaños sin comprimir que escribe el export) y cuenta como cargado lo que sale
    # de response.body, que el navegador ya ha descomprimido. Las dos cifras son sin comprimir.
    gzip_static  on;
    gzip         on;
    gzip_vary    on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    # text/html va siempre; el .pck no está en mime.types y sale como application/octet-stream.
    gzip_types   application/javascript application/wasm application/octet-stream;

    # index.html, el .pck y los .js (el cargador y los worklets de audio) no cambian de nombre
    # al re-exportar. Sin esto, el navegador sigue con el .pck viejo hasta Ctrl+Mayús+R y el
    # jugador ve la versión anterior. `no-cache` no es «no guardar»: revalida con ETag y, si no
    # ha cambiado, recibe un 304 sin volver a descargar los 10 MB.
    # El .wasm también: es el motor y casi nunca cambia, pero cuando cambia (otra versión de Godot)
    # tiene que llegar a la vez que el index.js que lo carga; un .wasm de ayer con un .js de hoy no
    # arranca. La revalidación es un 304 sin cuerpo, así que no cuesta los 40 MB.
    location ~* \.(html|pck|js|wasm)$ {
        add_header Cache-Control "no-cache" always;
    }

    # Iconos y pantalla de carga: caché normal de un día, que da igual si llegan tarde.
    location ~* \.png$ {
        add_header Cache-Control "public, max-age=86400" always;
    }

    # La raíz pasa a /index.html por `index`, y ahí aplica la regla de arriba.
    location / {
        try_files $uri $uri/ =404;
    }
}
